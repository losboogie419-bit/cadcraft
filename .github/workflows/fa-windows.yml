# FA fork: build the Windows x64 installer (MSI) and portable zip on every push to main, and
# publish them on the `downloads` branch at a fixed public link:
# https://github.com/<owner>/cadcraft/raw/downloads/cadcraft-windows-x64.msi Unsigned (no code-signing certificate), so Windows SmartScreen warns once.
name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fa-windows
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Fonts (craft-fonts, optional build input)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        run: |
          $env:CRAFT_FONTS_DIR = Join-Path $env:GITHUB_WORKSPACE 'craft-fonts'
          pwsh packaging/windows/package.ps1 -Arch x64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-fa-windows-x64
          path: dist/release/*

      - name: Publish to the downloads branch (fixed public link)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sha="${{ github.sha }}"
          mkdir pub && cd pub
          git init -q -b downloads
          cp ../dist/release/*.msi cadcraft-windows-x64.msi
          cp ../dist/release/*portable.zip cadcraft-windows-x64-portable.zip
          printf "# CADCraft FA — latest Windows build\n\nBuilt from commit %s.\n\n- Installer: cadcraft-windows-x64.msi\n- Portable: cadcraft-windows-x64-portable.zip\n\nUnsigned: Windows SmartScreen may warn — More info, then Run anyway.\n" "${sha:0:7}" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Windows build ${sha:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" downloads
