# FA fork: put an earlier build's installer on the `downloads` branch (no rebuild), at a fixed
# public link: https://github.com/<owner>/cadcraft/raw/downloads/cadcraft-windows-x64.msi
# Run it from the Actions tab with that build run's id.
name: Publish a build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id (from its Actions URL)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cadcraft-fa-windows-x64
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Push to the downloads branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} --jq .head_sha)
          mkdir pub && cd pub
          git init -q -b downloads
          cp ../dist/*.msi cadcraft-windows-x64.msi
          cp ../dist/*portable.zip cadcraft-windows-x64-portable.zip
          printf "# CADCraft FA — latest Windows build\n\nBuilt from commit %s.\n\n- Installer: cadcraft-windows-x64.msi\n- Portable: cadcraft-windows-x64-portable.zip\n\nUnsigned: Windows SmartScreen may warn — More info, then Run anyway.\n" "${sha:0:7}" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Windows build ${sha:0:7}"
          set +e
          out=$(git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" downloads 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then echo "::error::push failed: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"; exit 1; fi
